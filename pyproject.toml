[tool.poetry]
name = "commonroad-search"
version = "2024.1"
authors = ["Cyber-Physical Systems Group, Technical University of Munich <commonroad@lists.lrz.de>"]
license = "BSD"
readme = "README.md"
description = "Search-based motion planners with motion primitives"
keywords = ["autonomous", "automated", "vehicles", "driving", "motion", "planning", "search", "primitives"]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
packages = [
    {include = "SMP"},
]

include = [
    "SMP/**/*.xml",
    "SMP/**/*.automaton"
]

[tool.poetry.dependencies]
python = ">=3.8,<3.11"
commonroad-io = ">=2024.1"
commonroad-drivability-checker = ">=2024.1"
commonroad-route-planner = ">=2024.1.1"
tqdm = ">=4.64"
networkx = ">=2.4"
ipywidgets = "~7.5.1"
ipython-autotime = "~0.1"
matplotlib = ">=3.3.3"
numpy = [
    { version = ">=1.22, <1.26", python = "3.8" },
    { version = "^1.26.1", python = ">=3.9,<3.11" }
]
scipy = [
    { version = ">=1.10.0,<1.11", python = "3.8" },
    { version = "^1.11.3", python = ">=3.9,<3.13" }
]
ipython = "~7.18.1"
imageio = ">=2.34.0"
shapely = ">=1.6.4"
triangle = ">=20200424"
pyyaml = "!=6.0.0,!=5.4.0,!=5.4.1"

[project.urls]
homepage = "https://commonroad.in.tum.de/tools/commonroad-search"
Forum = "https://commonroad.in.tum.de/forum/c/commonroad-search/13"
Source = "https://gitlab.lrz.de/tum-cps/commonroad-search"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


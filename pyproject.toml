[tool.poetry]
name = "commonroad-search"
version = "2025.1"
authors = ["Cyber-Physical Systems Group, Technical University of Munich <commonroad@lists.lrz.de>"]
license = "BSD"
readme = "README.md"
description = "Search-based motion planners with motion primitives"
keywords = ["autonomous", "automated", "vehicles", "driving", "motion", "planning", "search", "primitives"]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
packages = [
    {include = "SMP"},
]

include = [
    "SMP/**/*.xml",
    "SMP/**/*.automaton"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
commonroad-io = ">=2024.3"
commonroad-drivability-checker = ">=2025.3.1"
commonroad-route-planner = ">=2025.1.0"
commonroad-clcs = ">=2025.2.0"
commonroad-vehicle-models = ">=3.0.2"

tqdm = ">=4.67"
networkx = ">=2.4"
ipywidgets = ">=8.1.5"
ipython-autotime = "~0.1"
matplotlib = ">=3.10"
numpy = ">=1.26"
scipy = ">=1.11.3"
ipython = "8.10.0"
ipython-genutils = ">=0.2.0"
imageio = ">=2.34.0"
shapely = ">=2.1"
triangle = ">=20200424"
pyyaml = ">=6.0.1"

[project.urls]
homepage = "https://commonroad.in.tum.de/tools/commonroad-search"
Forum = "https://commonroad.in.tum.de/forum/c/commonroad-search/13"
Source = "https://gitlab.lrz.de/tum-cps/commonroad-search"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "commonroad-search"
version = "2024.1"
